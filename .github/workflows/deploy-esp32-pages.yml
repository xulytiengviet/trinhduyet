name: Deploy ESP32 AI Cloud to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "esp32-cloud/frontend/**"
      - "config.js"
      - "index.html"
      - "docs/**"
      - ".github/workflows/deploy-esp32-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "esp32-github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone frontend
        working-directory: esp32-cloud/frontend
        env:
          PUBLIC_API_URL: https://trinhduyet-esp32-cloud-api.onrender.com
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: npm run build
      - name: Verify production artifact
        run: |
          test -s esp32-cloud/frontend/dist/index.html
          test -s esp32-cloud/frontend/dist/app.js
          test -s esp32-cloud/frontend/dist/style.css
          test -s esp32-cloud/frontend/dist/config.js
          test -s esp32-cloud/frontend/dist/_headers
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: esp32-cloud/frontend/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
